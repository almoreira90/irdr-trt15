name: Publicar site

# A coleta de dados (scraper) NÃO roda mais aqui: o WAF do TRT15 bloqueia por
# faixa de IP os runners de nuvem do GitHub Actions (confirmado: status 403
# mesmo com User-Agent de navegador). A coleta roda localmente (agendada via
# launchd, ver scraper/atualizar_e_publicar.sh) e este workflow só publica o
# conteúdo já coletado sempre que site/ muda no branch main.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
